name: HeatSatAI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Model Inference Verification
      run: python src/inference.py --include-metadata

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Urban Heat Insight"
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Docker Image
      run: docker build -t heatsatai-backend .
    - name: Build Frontend Docker Image
      run: cd "Urban Heat Insight" && docker build -t heatsatai-frontend .
